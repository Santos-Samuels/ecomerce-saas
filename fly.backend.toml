# fly.toml para o Backend (NestJS)
app = "ecomerce-backend"
primary_region = "gru"

[build]
  dockerfile = "backend.Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[env]
  PORT = "8080"
  NODE_ENV = "production"
  JWT_EXPIRES_IN = "365d"
  # CORS_ORIGIN deve ser a URL final do frontend
  CORS_ORIGIN = "https://ecomerce-frontend.fly.dev"
  IMAGEKIT_PUBLIC_KEY = "public_ajlJblb8U67ZEENHgB3Igtz6nag="
  IMAGEKIT_URL_ENDPOINT = "https://ik.imagekit.io/wzrwpc6ga"
  BASE_DOMAIN = "vendemais.store"

[deploy]
  release_command = "npx prisma migrate deploy --schema=./backend/prisma/schema.prisma"