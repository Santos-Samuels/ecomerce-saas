# fly.toml para o Frontend (Next.js)
app = "ecomerce-frontend"
primary_region = "gru"

[build]
  dockerfile = "frontend.Dockerfile"
  [build.args]
    NEXT_PUBLIC_API_URL = "https://ecomerce-backend.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[env]
  PORT = "3000"
  NODE_ENV = "production"
  NEXT_PUBLIC_API_URL = "https://ecomerce-backend.fly.dev"
